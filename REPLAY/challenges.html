
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RE:PLAY | Daily Challenges</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="xp.css">

    <script src="xp.js" defer></script>

<script src="trophies.js" defer></script>

    <script src="challenges-data.js" defer></script>
    <script src="challenges.js" defer></script>
</head>

<body>



<!-- trophy icon -->
<a href="trophies.html" class="trophy-link" aria-label="My trophies">
    <img src="images/gold_trophy.png" alt="Trophy case">
</a>



    <!-- replay logo -->
    <a href="index.html"
       class="replay-logo-link"
       aria-label="RE:PLAY homepage">
        <img src="images/replaylogo.png" alt="RE:PLAY">
    </a>

    <!-- page nav -->
    <nav class="replay-navigation" aria-label="Page navigation">
        <a href="questions.html">← Back</a>
        <a href="vending.html">Next →</a>
    </nav>

    <!-- xp bar -->
    <aside
        class="xp-bar"
        id="xpBar"
        aria-label="Your experience"
    >

        <div class="xp-heading">
            <span id="xpLevel">LEVEL 1</span>

            <span id="xpText" aria-live="polite">
                0 / 20 XP
            </span>
        </div>

        <div class="xp-meter">

            <div
                class="xp-track"
                id="xpTrack"
                role="progressbar"
                aria-label="Level progress"
                aria-valuemin="0"
                aria-valuemax="20"
                aria-valuenow="0"
            >
                <div class="xp-liquid"></div>
            </div>

            <div class="xp-marker">
                <img src="images/replaylogo.png" alt="">
            </div>

        </div>

    </aside>

    <main>

        <!-- daily challenges -->
        <section
            id="challenges"
            aria-labelledby="challengeGreeting"
        >

            <h1 id="challengeGreeting">
                Your Daily Challenges
            </h1>

            <!-- checklist -->
            <div id="challengeList"></div>

            <!-- progress tracker -->
            <p
                id="challengeProgress"
                role="status"
                aria-live="polite"
            >
                0 / 3 completed
            </p>

            <!-- link to vending machine -->
            <a href="vending.html" class="mybtn mybtn2">
                Want to try something new? →
            </a>

        </section>

    </main>

</body>

</html>
